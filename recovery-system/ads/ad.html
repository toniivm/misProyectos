<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#080c12;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:relative;width:100vw;height:100vh;overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(16,191,216,.16), transparent 55%),
      radial-gradient(90% 70% at 50% 100%, rgba(16,191,216,.08), transparent 60%),
      linear-gradient(180deg,#0a1017 0%, #080c12 55%, #060a0f 100%);
    color:#f2eee7;display:flex;flex-direction:column;padding:5.2vmin 6vmin}
  /* grain */
  #stage::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.05;
    background-image:radial-gradient(circle at 20% 30%, #fff 0.6px, transparent 0.6px);
    background-size:14px 14px}
  .top{display:flex;align-items:center;gap:1.4vmin;font-weight:800;letter-spacing:.22em;
    text-transform:uppercase;font-size:2.1vmin;color:#f2eee7}
  .top img{width:4.4vmin;height:4.4vmin;object-fit:contain}
  .top .sub{color:#10BFD8;font-size:1.6vmin;letter-spacing:.2em}
  .head{margin-top:3.4vmin}
  .eyebrow{color:#10BFD8;font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:1.9vmin;margin-bottom:1.6vmin}
  h1{font-size:8.6vmin;line-height:1.02;letter-spacing:-.035em;font-weight:800;max-width:88%}
  h1 .cy{color:#10BFD8}
  .subline{margin-top:1.8vmin;font-size:3vmin;line-height:1.35;color:#aab4c2;max-width:80%;font-weight:500}
  .stage2{flex:1;display:flex;align-items:center;justify-content:center;position:relative;margin:2vmin 0}
  .glow{position:absolute;width:78vmin;height:78vmin;border-radius:50%;
    background:radial-gradient(circle,rgba(16,191,216,.22),transparent 62%);filter:blur(2vmin)}
  .card{position:relative;width:82%;background:#ffffff;
    border-radius:5vmin;padding:4.2vmin;box-shadow:0 6vmin 12vmin rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.05)}
  .card img{width:100%;height:auto;display:block;filter:drop-shadow(0 3vmin 3vmin rgba(0,0,0,.22))}
  .chips{display:flex;gap:1.2vmin;flex-wrap:wrap;margin-top:3vmin;justify-content:center}
  .chip{background:#0d1219;color:#e8eef5;border-radius:99px;padding:.9vmin 2vmin;font-size:1.9vmin;font-weight:700;letter-spacing:.02em}
  .chip.cy{background:rgba(16,191,216,.14);color:#10BFD8;border:1px solid rgba(16,191,216,.35)}
  .price{position:absolute;right:-1vmin;top:-1vmin;background:#10BFD8;color:#04222a;font-weight:900;
    border-radius:99px;padding:1.2vmin 2.4vmin;font-size:2.6vmin;box-shadow:0 2vmin 4vmin rgba(0,0,0,.4)}
  .bottom{margin-top:2.4vmin;display:flex;flex-direction:column;gap:1.6vmin}
  .cta{display:inline-flex;align-items:center;justify-content:center;gap:1.2vmin;background:#ffffff;color:#080c12;
    border-radius:99px;padding:2.6vmin 5vmin;font-weight:800;font-size:3.1vmin;align-self:flex-start;
    box-shadow:0 3vmin 6vmin rgba(255,255,255,.12)}
  .trust{display:flex;gap:2.4vmin;color:#8791a1;font-size:2vmin;font-weight:600;flex-wrap:wrap}
  .trust b{color:#e8eef5}
  .rule{height:1px;background:linear-gradient(90deg,#10BFD8,transparent);margin:1.6vmin 0}

  /* formato cuadrado y 4:5 — más compacto */
  #stage.compact{padding:3.4vmin 5vmin}
  #stage.compact .head{margin-top:2.2vmin}
  #stage.compact h1{font-size:6vmin}
  #stage.compact .subline{font-size:2.5vmin;margin-top:1.2vmin}
  #stage.compact .stage2{margin:1.2vmin 0}
  #stage.compact .card{width:58%;padding:3vmin}
  #stage.compact .chips{margin-top:2vmin}
  #stage.compact .chip{font-size:1.6vmin}
  #stage.compact .cta{padding:2.2vmin 4.2vmin;font-size:2.7vmin}
  #stage.compact .trust{font-size:1.8vmin}
</style>
</head>
<body>
<div id="stage">
  <div class="top">
    <img src="../public/images/logo/logo-compact.webp" alt="Noctip" />
    <span>Noctip</span>
    <span class="sub" id="brandsub">Sueño &amp; Recuperación</span>
  </div>

  <div class="head">
    <div class="eyebrow" id="eyebrow">Almohada cervical</div>
    <h1 id="headline"></h1>
    <div class="subline" id="subline"></div>
  </div>

  <div class="stage2">
    <div class="glow"></div>
    <div class="card">
      <div class="price" id="price" style="display:none"></div>
      <img id="product" src="assets/product.png" alt="" />
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <div class="bottom">
    <div class="cta" id="cta"></div>
    <div class="trust">
      <span><b>30 noches</b> de prueba</span>
      <span><b>Pago seguro</b> Stripe</span>
      <span id="ship"><b>Envío</b> con seguimiento</span>
    </div>
  </div>
</div>

<script>
  const q = new URLSearchParams(location.search);
  const concept = q.get('concept') || 'A';

  const ADS = {
    A: {
      eyebrow: 'Almohada cervical',
      headline: 'Te levantas con el <span class="cy">cuello cargado</span>.',
      subline: 'No siempre es la edad. A veces es la forma y la altura de tu almohada.',
      chips: ['Memory foam', {cy:'Se ajusta a ti'}, 'Funda lavable'],
      cta: 'Ver cómo se ajusta',
      price: ''
    },
    B: {
      eyebrow: 'La altura importa',
      headline: 'Una almohada que se <span class="cy">ajusta</span> a cómo duermes.',
      subline: 'Regula la altura hasta encontrar tu punto. De lado o de espaldas.',
      chips: [{cy:'Altura regulable'}, 'Funda lavable', 'Memory foam'],
      cta: 'Ver la almohada',
      price: ''
    },
    C: {
      eyebrow: 'Antes de comprar otra',
      headline: '¿Otra almohada más? <span class="cy">Esta se ajusta.</span>',
      subline: 'Y la funda se lava. Si no te encaja, tienes 30 noches para devolverla.',
      chips: ['Se ajusta', {cy:'Funda lavable'}, 'Medidas 59×33 cm'],
      cta: 'Míralo aquí',
      price: ''
    }
  };

  const a = ADS[concept] || ADS.A;
  document.getElementById('eyebrow').textContent = a.eyebrow;
  document.getElementById('headline').innerHTML = a.headline;
  document.getElementById('subline').textContent = a.subline;
  document.getElementById('cta').textContent = a.cta;

  const chips = document.getElementById('chips');
  a.chips.forEach(c => {
    const d = document.createElement('div');
    if (typeof c === 'string') { d.className = 'chip'; d.textContent = c; }
    else { d.className = 'chip cy'; d.textContent = c.cy; }
    chips.appendChild(d);
  });

  if (a.price) {
    const p = document.getElementById('price');
    p.style.display = 'block';
    p.textContent = a.price;
  }

  // formato cuadrado (1:1) y 4:5 → layout compacto
  const ratio = window.innerHeight / window.innerWidth;
  if (ratio < 1.45) document.getElementById('stage').classList.add('compact');
</script>
</body>
</html>
