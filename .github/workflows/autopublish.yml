name: Noctip Auto Publish — 1 vídeo/día 19:00 ES

on:
  schedule:
    - cron: '0 17 * * *' # 17:00 UTC = 19:00 ES verano (18:00 invierno, ajusta si quieres)
  workflow_dispatch:
    inputs:
      product:
        description: 'Forzar producto: halo, rest, wave, neck-massager'
        required: false
        default: ''

jobs:
  autopublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test publisher (dry-run)
        run: node scripts/autopublish/autoVideoPublisher.js --product=${{ inputs.product || 'halo' }} --dry-run
      - name: Publish video
        run: node scripts/autopublish/autoVideoPublisher.js --product=${{ inputs.product }}
        env:
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNELS: ${{ secrets.BUFFER_CHANNELS }}
          MULTI_UPLOAD_API_KEY: ${{ secrets.MULTI_UPLOAD_API_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      - name: Commit log
        run: |
          git config user.name "noctip-bot"
          git config user.email "bot@noctip.com"
          git add docs/autopublish-log.json || true
          git diff --staged --quiet || git commit -m "chore: autopublish log $(date +%F)" && git push || true
